<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Legacy Awaken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<style>
/* Layout: editing bay. Film gate + transport + line timeline on the left, control rack on the right; stacks on phones.
   Deliberately single dark look (a darkroom), so every color is set explicitly. */
:root {
  --ink: #15121a;        /* page */
  --panel: #1e1a24;      /* rack */
  --panel-2: #29232f;    /* inputs, raised */
  --rule: #3b3444;       /* hairlines */
  --fg: #eee7da;         /* warm paper white */
  --muted: #a69db0;
  --accent: #f0a13a;     /* safelight amber */
  --accent-ink: #1b1206;
  --line-dark: #0c0a0f;
  --line-light: #f7f0e3;
  --ok: #8fcf9a;
  --warn: #f08a6c;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--ink); color: var(--fg);
  font-family: var(--body); font-size: 14px; line-height: 1.45;
}
.app {
  min-height: 100%;
  display: grid; grid-template-rows: auto 1fr;
  padding-inline: 16px; padding-block: 12px 16px;
  gap: 12px; box-sizing: border-box;
}
header.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  justify-content: space-between;
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 {
  margin: 0; font-family: var(--display); font-weight: 800;
  font-size: 30px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1;
}
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.bar-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

button, .btn, select, input[type="number"] {
  font: inherit; color: var(--fg); background: var(--panel-2);
  border: 1px solid var(--rule); border-radius: 6px;
}
button, .btn { padding: 7px 12px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .btn:hover { border-color: var(--muted); }
button:focus-visible, .btn:focus-within, select:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.06); }
button:disabled { opacity: 0.5; cursor: default; }
select { padding: 6px 8px; }
.btn input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.btn { position: relative; }

main.bay {
  display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; min-height: 0;
}
@media (max-width: 880px) { main.bay { grid-template-columns: minmax(0, 1fr); } }

/* ---------- stage ---------- */
.stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.gate {
  position: relative; border-radius: 10px; background: #0b090d;
  padding: 14px 34px 32px; display: grid; place-items: safe center;
  min-height: 300px; overflow: auto;
}
.gate::before, .gate::after {   /* sprocket holes, purely the film-strip frame */
  content: ""; position: absolute; top: 10px; bottom: 10px; width: 12px;
  background: repeating-linear-gradient(to bottom, #2a2430 0 9px, transparent 9px 22px);
  border-radius: 2px; pointer-events: none;
}
.gate::before { left: 11px; } .gate::after { right: 11px; }
.gate.drag { box-shadow: inset 0 0 0 2px var(--accent); }
.canvas-wrap {
  background-color: #2b2630;
  background-image: conic-gradient(#3a3440 25%, transparent 0 50%, #3a3440 0 75%, transparent 0);
  background-size: 16px 16px; line-height: 0;
}
#view { display: block; max-width: 100%; height: auto; }
.gate.zoom-fit #view { max-height: 62vh; width: auto; }
.gate.zoom-1 #view, .gate.zoom-2 #view { max-width: none; max-height: none; }
.drop-hint {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
  font-size: 12px; color: var(--muted); white-space: nowrap; pointer-events: none;
}
.badge {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 4px;
}

.transport { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.counter {
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px;
  color: var(--muted); padding-inline: 6px;
}
.counter b { color: var(--fg); font-weight: 500; }
.spacer { flex: 1; }
.file-name { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

.timeline-block { display: flex; flex-direction: column; gap: 6px; }
.tl-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.tl-head .key { display: inline-flex; gap: 12px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--rule); }
.sw.d { background: var(--line-dark); } .sw.l { background: var(--line-light); }
.timeline {
  display: grid; gap: 2px; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
  height: 30px;
}
.cell {
  background: var(--panel-2); border-radius: 2px; position: relative;
  font-family: var(--mono); font-size: 10px; display: grid; place-items: center; color: var(--muted);
  cursor: pointer; overflow: hidden;
}
.cell.d { background: var(--line-dark); color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule); }
.cell.l { background: var(--line-light); color: #3b3444; }
.cell.now { outline: 2px solid var(--accent); outline-offset: -1px; z-index: 1; }

.export { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.status.ok { color: var(--ok); } .status.warn { color: var(--warn); }
.progress { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.1s linear; }

.result {
  display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 12px; align-items: start;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px;
}
.result video { width: 100%; border-radius: 6px; background: #0b090d; }
.result .meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.result .meta strong { font-family: var(--mono); font-weight: 500; overflow-wrap: anywhere; }
@media (max-width: 520px) { .result { grid-template-columns: minmax(0, 1fr); } }

/* ---------- control rack ---------- */
.rack {
  background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
}
@media (min-width: 881px) { .rack { max-height: calc(100vh - 92px); position: sticky; top: env(safe-area-inset-top, 0px); } }
.rack-head {
  padding: 12px 14px; border-bottom: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: 8px;
}
.rack-head label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.preset-row { display: flex; gap: 8px; }
.preset-row select { flex: 1; min-width: 0; }
.rack-body { overflow-y: auto; padding: 4px 14px 14px; }
details.group { border-bottom: 1px solid var(--rule); padding-block: 10px; }
details.group:last-child { border-bottom: 0; }
details.group > summary {
  cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
  font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase;
}
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::after { content: "+"; font-family: var(--mono); color: var(--muted); font-size: 14px; }
details.group[open] > summary::after { content: "−"; }
.group-note { color: var(--muted); font-size: 12px; margin: 4px 0 2px; }
.ctrl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding-top: 10px; align-items: center; }
.ctrl label { font-size: 13px; }
.ctrl output { font-family: var(--mono); font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
.ctrl input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.ctrl select, .ctrl input[type="number"] { grid-column: 2; padding: 4px 6px; max-width: 170px; }
.ctrl .hint { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.ctrl.check { grid-template-columns: auto minmax(0, 1fr); }
.ctrl.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.seed-row { display: flex; gap: 6px; grid-column: 2; }
.seed-row input { width: 70px; }

.script-box { display: flex; flex-direction: column; gap: 8px; }
.script-box textarea {
  width: 100%; box-sizing: border-box; min-height: 150px; resize: vertical;
  font-family: var(--mono); font-size: 11.5px; line-height: 1.5;
  background: var(--panel-2); color: var(--fg); border: 1px solid var(--rule); border-radius: 6px; padding: 8px;
}
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Legacy <span>Awaken</span></h1>
      <p>Storm-style film grain for Blazing legacy units</p>
    </div>
    <div class="bar-actions">
      <label class="btn" for="file">Open image<input id="file" type="file" accept="image/*"></label>
      <span class="file-name" id="fileName">Sample: box art</span>
    </div>
  </header>

  <main class="bay">
    <section class="stage" aria-label="Preview">
      <div class="gate zoom-fit" id="gate">
        <span class="badge" id="badge" hidden>Original</span>
        <div class="canvas-wrap"><canvas id="view" width="10" height="10" aria-label="Animated preview of the filtered image"></canvas></div>
        <span class="drop-hint">Drop or paste an image here</span>
      </div>

      <div class="transport">
        <button id="play" type="button" aria-label="Pause">Pause</button>
        <button id="prev" type="button" aria-label="Previous frame">◂ Frame</button>
        <button id="next" type="button" aria-label="Next frame">Frame ▸</button>
        <button id="compare" type="button">Hold for original</button>
        <span class="counter" id="counter">FR <b>01</b> / 36 · 0.00 s</span>
        <span class="spacer"></span>
        <select id="zoom" aria-label="Preview zoom">
          <option value="fit">Fit</option>
          <option value="1">100%</option>
          <option value="2">200%</option>
        </select>
      </div>

      <div class="timeline-block">
        <div class="tl-head">
          <span>Line timeline: one cell per frame, letters mark the zone (L, M, R…)</span>
          <span class="key"><span><i class="sw d"></i>black</span><span><i class="sw l"></i>white</span></span>
        </div>
        <div class="timeline" id="timeline" role="group" aria-label="Frames in the loop"></div>
      </div>

      <div class="export">
        <button class="primary" id="renderVideo" type="button">Render video</button>
        <button id="savePng" type="button">Save this frame (PNG)</button>
        <span class="status" id="status" role="status"></span>
      </div>
      <div class="progress" id="progress" hidden><i></i></div>

      <div class="result" id="result" hidden>
        <video id="resultVideo" muted loop playsinline autoplay></video>
        <div class="meta">
          <strong id="resultName"></strong>
          <span class="status" id="resultInfo"></span>
          <div class="export">
            <button class="primary" id="saveVideo" type="button">Save video</button>
            <button id="discard" type="button">Discard</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="rack" aria-label="Controls">
      <div class="rack-head">
        <label for="preset">Preset</label>
        <div class="preset-row">
          <select id="preset"></select>
          <button id="resetPreset" type="button">Reset</button>
        </div>
      </div>
      <div class="rack-body" id="rackBody"></div>
    </aside>
  </main>
</div>

<script>
(() => {
"use strict";

/* ---------------- presets & controls ---------------- */
const LOOK_KEYS = ["sepia","desat","fade","bright","vignette","grain","grainSize","flicker","lanes","passes","hold",
  "darkShare","blackOpacity","whiteOpacity","softness","jitter","dust","dustSize","fps","frames","wobble"];

const PRESETS = {
  bright: { label: "Legacy Bright", sepia: .12, desat: .05, fade: .02, bright: 1.06, vignette: .12, grain: .032, grainSize: .6, flicker: 0,
    lanes: 3, passes: 2, hold: 3, darkShare: .5, blackOpacity: .32, whiteOpacity: .32, softness: .9, jitter: true,
    dust: 3, dustSize: 1, fps: 18, frames: 36, wobble: 0 },
  soft: { label: "Legacy Soft", sepia: .25, desat: .2, fade: .05, bright: 1, vignette: .25, grain: .032, grainSize: .6, flicker: 0,
    lanes: 3, passes: 2, hold: 3, darkShare: .5, blackOpacity: .32, whiteOpacity: .32, softness: .9, jitter: true,
    dust: 3, dustSize: 1, fps: 18, frames: 36, wobble: 0 },
  grain: { label: "Grain only", sepia: 0, desat: .1, fade: .03, bright: 1, vignette: .15, grain: .028, grainSize: .6, flicker: 0,
    lanes: 0, passes: 1, hold: 3, darkShare: .5, blackOpacity: .3, whiteOpacity: .3, softness: .9, jitter: true,
    dust: 0, dustSize: 1, fps: 18, frames: 36, wobble: 0 },
  scene: { label: "Storm flashback", sepia: .6, desat: .4, fade: .08, bright: 1, vignette: .6, grain: .045, grainSize: .9, flicker: .02,
    lanes: 4, passes: 2, hold: 3, darkShare: .4, blackOpacity: .6, whiteOpacity: .55, softness: .6, jitter: true,
    dust: 18, dustSize: 1, fps: 18, frames: 36, wobble: 1 },
  reel: { label: "Old reel (heavy)", sepia: .85, desat: .6, fade: .12, bright: 1, vignette: .85, grain: .065, grainSize: 1.1, flicker: .04,
    lanes: 5, passes: 3, hold: 2, darkShare: .5, blackOpacity: .8, whiteOpacity: .75, softness: .5, jitter: true,
    dust: 35, dustSize: 1.2, fps: 18, frames: 36, wobble: 2 }
};
const OUTPUT_DEFAULTS = { renderScale: 4, maskMode: "auto", loops: 4, seed: 7 };

const pct = v => Math.round(v * 100) + "%";
const GROUPS = [
  { name: "Color", open: true, items: [
    { key: "sepia", label: "Sepia tone", min: 0, max: 1, step: .01, fmt: pct, kind: "color" },
    { key: "desat", label: "Desaturate", min: 0, max: 1, step: .01, fmt: pct, kind: "color" },
    { key: "fade", label: "Fade (lifted blacks, dull whites)", min: 0, max: .2, step: .005, fmt: v => v.toFixed(3), kind: "color" },
    { key: "bright", label: "Brightness", min: .8, max: 1.3, step: .01, fmt: v => v.toFixed(2) + "×", kind: "color" },
    { key: "vignette", label: "Edge darkening", min: 0, max: 1, step: .01, fmt: pct, kind: "color" }
  ]},
  { name: "Grain", open: true, items: [
    { key: "grain", label: "Grain amount", min: 0, max: .12, step: .002, fmt: v => (v * 100).toFixed(1), kind: "color" },
    { key: "grainSize", label: "Grain size", min: .3, max: 3, step: .05, fmt: v => v.toFixed(2) + " px", hint: "Measured in pixels of your original image." },
    { key: "flicker", label: "Exposure flicker", min: 0, max: .08, step: .002, fmt: pct }
  ]},
  { name: "Scratch lines", open: true, note: "Each zone gets one line per pass, so lines spread across the whole box.", items: [
    { key: "lanes", label: "Line zones", min: 0, max: 6, step: 1, fmt: v => v ? v + " zones" : "off", kind: "sched" },
    { key: "passes", label: "Passes per loop", min: 1, max: 4, step: 1, fmt: v => v + "×", kind: "sched" },
    { key: "hold", label: "Line duration", min: 1, max: 8, step: 1, fmt: v => v + " fr", kind: "sched" },
    { key: "darkShare", label: "Black vs white", min: 0, max: 1, step: .05, fmt: v => Math.round(v * 100) + "% black", kind: "sched" },
    { key: "blackOpacity", label: "Black line strength", min: 0, max: 1, step: .01, fmt: pct },
    { key: "whiteOpacity", label: "White line strength", min: 0, max: 1, step: .01, fmt: pct },
    { key: "softness", label: "Line softness", min: 0, max: 3, step: .05, fmt: v => v.toFixed(2) + " px", hint: "0 is a razor-sharp 1px line; higher feathers the edges." },
    { key: "jitter", label: "1px jitter while a line is showing", type: "check" }
  ]},
  { name: "Dust", open: false, items: [
    { key: "dust", label: "Specks per frame", min: 0, max: 60, step: 1, fmt: v => String(v) },
    { key: "dustSize", label: "Speck size", min: .5, max: 3, step: .05, fmt: v => v.toFixed(2) + "×" }
  ]},
  { name: "Motion", open: false, items: [
    { key: "fps", label: "Frame rate", min: 6, max: 30, step: 1, fmt: v => v + " fps" },
    { key: "frames", label: "Loop length", min: 12, max: 96, step: 1, fmt: v => v + " fr", kind: "sched" },
    { key: "wobble", label: "Projector wobble", min: 0, max: 3, step: 1, fmt: v => v ? v + " px" : "still", hint: "Keep at 0 for box art so the art never moves." },
    { key: "seed", label: "Random seed", type: "seed", kind: "sched" }
  ]},
  { name: "Output", open: false, items: [
    { key: "renderScale", label: "Render size", type: "select", kind: "prep",
      options: [[1, "1× (original)"], [2, "2×"], [3, "3×"], [4, "4× (hairline lines)"]], num: true },
    { key: "maskMode", label: "Apply to", type: "select", kind: "prep",
      options: [["auto", "Box only (skip checkerboard)"], ["whole", "Whole image"]] },
    { key: "loops", label: "Loops in video", type: "select", options: [[1,"1"],[2,"2"],[4,"4"],[6,"6"],[8,"8"]], num: true }
  ]}
];

/* ---------------- state ---------------- */
const STORE_KEY = "legacy-awaken-v1";
let presetId = "bright";
let P = { ...PRESETS.bright, ...OUTPUT_DEFAULTS };
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved && saved.P) { P = { ...P, ...saved.P }; presetId = saved.presetId || "custom"; }
} catch (e) { /* storage unavailable */ }
delete P.label;
const persist = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify({ P, presetId })); } catch (e) {} };

const view = document.getElementById("view");
const vctx = view.getContext("2d", { willReadFrequently: true });
let srcName = "box_art";
let img = null, natW = 0, natH = 0, R = 1, W = 0, H = 0, N = 0;
let src = null, base = null, gm = null, vig = null, mask = null, darkAcc = null, lightAcc = null;
let outImg = null, hasAlpha = false, maskNote = "";
let sched = [];
let frame = 0, playing = !matchMedia("(prefers-reduced-motion: reduce)").matches;
let showOriginal = false, recording = false, dirty = true;
const noiseSmall = document.createElement("canvas"), nsCtx = noiseSmall.getContext("2d");
const noiseBig = document.createElement("canvas"), nbCtx = noiseBig.getContext("2d", { willReadFrequently: true });

/* ---------------- helpers ---------------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const $ = id => document.getElementById(id);
function setStatus(msg, cls) { const s = $("status"); s.textContent = msg; s.className = "status" + (cls ? " " + cls : ""); }

/* ---------------- preparation ---------------- */
function prepare() {
  if (!img) return;
  const cap = Math.max(1, Math.floor(1600 / Math.max(natW, natH)));
  R = Math.min(P.renderScale, cap);
  W = natW * R; H = natH * R; N = W * H;
  view.width = W; view.height = H;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const cx = c.getContext("2d", { willReadFrequently: true });
  cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = "high";
  cx.drawImage(img, 0, 0, W, H);
  src = cx.getImageData(0, 0, W, H).data;
  base = new Float32Array(N * 3); gm = new Float32Array(N); vig = new Float32Array(N);
  darkAcc = new Float32Array(N); lightAcc = new Float32Array(N);
  outImg = vctx.createImageData(W, H);
  noiseBig.width = W; noiseBig.height = H;
  buildMask();
  prepareColor();
  dirty = true;
}

function buildMask() {
  mask = new Float32Array(N);
  // native pixels for detection
  const c = document.createElement("canvas"); c.width = natW; c.height = natH;
  const cx = c.getContext("2d", { willReadFrequently: true });
  cx.drawImage(img, 0, 0);
  const d = cx.getImageData(0, 0, natW, natH).data;
  hasAlpha = false;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 250) { hasAlpha = true; break; }
  if (P.maskMode === "whole" || hasAlpha) {
    mask.fill(1);
    maskNote = hasAlpha ? "Transparent areas stay transparent." : "Effect covers the whole image.";
    return;
  }
  // flood-fill checkerboard-looking pixels in from the edges
  const n = natW * natH, bg = new Uint8Array(n), checker = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), v = (r + g + b) / 3;
    checker[i] = (mx - mn < 22 && v > 110 && v < 215) ? 1 : 0;
  }
  const stack = [];
  const push = i => { if (checker[i] && !bg[i]) { bg[i] = 1; stack.push(i); } };
  for (let x = 0; x < natW; x++) { push(x); push((natH - 1) * natW + x); }
  for (let y = 0; y < natH; y++) { push(y * natW); push(y * natW + natW - 1); }
  while (stack.length) {
    const i = stack.pop(), x = i % natW, y = (i / natW) | 0;
    if (x > 0) push(i - 1); if (x < natW - 1) push(i + 1);
    if (y > 0) push(i - natW); if (y < natH - 1) push(i + natW);
  }
  let bgCount = 0; for (let i = 0; i < n; i++) bgCount += bg[i];
  if (bgCount < n * 0.01) { mask.fill(1); maskNote = "No checkerboard found, so the effect covers the whole image."; return; }
  // soften edge (3x3 box) and upscale smoothly
  const m = cx.createImageData(natW, natH);
  for (let y = 0; y < natH; y++) for (let x = 0; x < natW; x++) {
    let s = 0, k = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx >= 0 && yy >= 0 && xx < natW && yy < natH) { s += bg[yy * natW + xx] ? 0 : 1; k++; }
    }
    const v = Math.round(s / k * 255), j = (y * natW + x) * 4;
    m.data[j] = m.data[j + 1] = m.data[j + 2] = v; m.data[j + 3] = 255;
  }
  cx.putImageData(m, 0, 0);
  const big = document.createElement("canvas"); big.width = W; big.height = H;
  const bx = big.getContext("2d", { willReadFrequently: true });
  bx.imageSmoothingEnabled = true; bx.drawImage(c, 0, 0, W, H);
  const md = bx.getImageData(0, 0, W, H).data;

  maskNote = "Box detected; the checkerboard stays untouched.";
}

function prepareColor() {
  if (!src) return;
  const { sepia, desat, fade, bright, grain, vignette } = P;
  const hw = W / 2, hh = H / 2;
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) {
    let r = src[i * 4] / 255, g = src[i * 4 + 1] / 255, b = src[i * 4 + 2] / 255;
    const l0 = .299 * r + .587 * g + .114 * b;
    r = r * (1 - desat) + l0 * desat; g = g * (1 - desat) + l0 * desat; b = b * (1 - desat) + l0 * desat;
    const sr = Math.min(1, .393 * r + .769 * g + .189 * b), sg = Math.min(1, .349 * r + .686 * g + .168 * b), sb = Math.min(1, .272 * r + .534 * g + .131 * b);
    r = r * (1 - sepia) + sr * sepia; g = g * (1 - sepia) + sg * sepia; b = b * (1 - sepia) + sb * sepia;
    r = (fade + r * (1 - fade * 1.8)) * bright; g = (fade + g * (1 - fade * 1.8)) * bright; b = (fade + b * (1 - fade * 1.8)) * bright;
    base[i * 3] = r; base[i * 3 + 1] = g; base[i * 3 + 2] = b;
    const l1 = .299 * r + .587 * g + .114 * b;
    gm[i] = (1 - Math.abs(l1 * 2 - 1) * .6) * grain;
    const dd = Math.sqrt(((x - hw) / hw) ** 2 + ((y - hh) / hh) ** 2) / Math.SQRT2;
    const v = Math.pow(clamp((dd - .35) / .65, 0, 1), 1.6);
    vig[i] = 1 - v * vignette;
  }
  dirty = true;
}

/* ---------------- line schedule ---------------- */
function buildSchedule() {
  const F = P.frames, L = P.lanes;
  sched = new Array(F).fill(null);
  if (!L) return renderTimeline();
  const prng = mulberry32(P.seed + 99);
  const perm = () => { const a = [...Array(L).keys()]; for (let i = L - 1; i > 0; i--) { const j = Math.floor(prng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let order = [];
  for (let p = 0; p < P.passes; p++) {
    let pick = perm();
    for (let t = 0; t < 50; t++) {
      const asc = pick.every((v, k) => !k || v > pick[k - 1]), desc = pick.every((v, k) => !k || v < pick[k - 1]);
      const sweep = L > 2 && (asc || desc);
      if (!sweep && (!order.length || pick[0] !== order[order.length - 1])) break;
      pick = perm();
    }
    order = order.concat(pick);
  }
  let period = Math.floor(F / order.length);
  if (period < 1) { order = order.slice(0, F); period = 1; }
  const slots = order.length, h = Math.min(P.hold, period), start = Math.floor((period - h) / 2);
  let signs;
  if (Math.abs(P.darkShare - .5) < 1e-6) {
    const seen = {}; signs = order.map(l => { const j = seen[l] || 0; seen[l] = j + 1; return (l + j) % 2 === 0 ? -1 : 1; });
  } else {
    const nd = Math.round(slots * P.darkShare);
    signs = order.map((_, k) => Math.floor(k * nd / slots) !== Math.floor((k + 1) * nd / slots) ? -1 : 1);
  }
  for (let s = 0; s < slots; s++) for (let k = 0; k < h; k++) {
    const f = s * period + start + k;
    if (f < F) sched[f] = { lane: order[s], sign: signs[s], slot: s, first: k === 0 };
  }
  renderTimeline();
}
function laneLetter(l) { return P.lanes === 3 ? "LMR"[l] : P.lanes === 2 ? "LR"[l] : String(l + 1); }

function renderTimeline() {
  const tl = $("timeline"); tl.innerHTML = "";
  for (let f = 0; f < P.frames; f++) {
    const c = document.createElement("button");
    c.type = "button"; c.className = "cell";
    const e = sched[f];
    if (e) { c.classList.add(e.sign < 0 ? "d" : "l"); if (e.first) c.textContent = laneLetter(e.lane); }
    c.setAttribute("aria-label", "Frame " + (f + 1) + (e ? ", " + (e.sign < 0 ? "black" : "white") + " line" : ""));
    c.addEventListener("click", () => { frame = f; playing = false; syncPlay(); dirty = true; });
    tl.appendChild(c);
  }
  dirty = true;
}

/* ---------------- frame rendering ---------------- */
function renderFrame(f) {
  if (!src) return;
  const o = outImg.data;
  if (showOriginal) { o.set(src); vctx.putImageData(outImg, 0, 0); return; }
  const rng = mulberry32(P.seed * 1000 + f);

  // grain: low-res noise, upscaled smoothly
  const gs = Math.max(1, P.grainSize * R);
  const nw = Math.ceil(W / gs), nh = Math.ceil(H / gs);
  if (noiseSmall.width !== nw || noiseSmall.height !== nh) { noiseSmall.width = nw; noiseSmall.height = nh; }
  const ni = nsCtx.createImageData(nw, nh), nd = ni.data;
  const u = () => (rng() + rng() + rng() - 1.5) * 2;   // ~N(0,1)
  for (let i = 0; i < nw * nh; i++) {
    const g = u(), j = i * 4;
    nd[j] = 128 + (g + .25 * u()) * 32; nd[j + 1] = 128 + (g + .25 * u()) * 32; nd[j + 2] = 128 + (g + .25 * u()) * 32; nd[j + 3] = 255;
  }
  nsCtx.putImageData(ni, 0, 0);
  nbCtx.imageSmoothingEnabled = true; nbCtx.imageSmoothingQuality = "high";
  nbCtx.drawImage(noiseSmall, 0, 0, nw * gs, nh * gs);
  const nz = nbCtx.getImageData(0, 0, W, H).data;

  const fl = 1 + (rng() * 2 - 1) * P.flicker;
  const wob = P.wobble ? P.wobble : 0;
  const dx = wob ? Math.round((rng() * 2 - 1) * wob) : 0, dy = wob ? Math.round((rng() * 2 - 1) * wob) : 0;

  darkAcc.fill(0); lightAcc.fill(0);
  // scratch line
  const e = sched[f];
  if (e) {
    const srng = mulberry32(P.seed * 31 + e.slot);
    const lo = .08 + .84 * e.lane / P.lanes, hi = .08 + .84 * (e.lane + 1) / P.lanes;
    const x0 = ((lo + hi) / 2 + (srng() * .4 - .2) * (hi - lo)) * W;
    const drift = (srng() * .02 - .01) * W;
    const strength = .7 + .3 * srng();
    const jx = P.jitter ? Math.floor(rng() * 3) - 1 : 0;
    const amp = strength * (.6 + .4 * rng());
    const sig = P.softness, K = sig < .2 ? 0 : Math.ceil(sig * 3);
    const wts = []; let ws = 0;
    for (let k = -K; k <= K; k++) { const w = K ? Math.exp(-k * k / (2 * sig * sig)) : 1; wts.push(w); ws += w; }
    const target = e.sign < 0 ? darkAcc : lightAcc;
    const mult = e.sign < 0 ? P.blackOpacity : .6 * P.whiteOpacity;
    for (let y = 0; y < H; y++) {
      const xc = Math.round(x0 + drift * (y / H)) + jx;
      for (let k = -K; k <= K; k++) { const x = xc + k; if (x >= 0 && x < W) target[y * W + x] += amp * mult * wts[k + K] / ws; }
    }
  }
  // dust
  for (let d = 0; d < P.dust; d++) {
    const x = rng() * W, y = rng() * H, r = (.6 + 1.6 * rng()) * P.dustSize * R;
    const dark = rng() < .65, s = .4 + .6 * rng(), asp = .5 + rng();
    const x1 = Math.max(0, Math.floor(x - 3 * r)), x2 = Math.min(W - 1, Math.ceil(x + 3 * r));
    const y1 = Math.max(0, Math.floor(y - 3 * r)), y2 = Math.min(H - 1, Math.ceil(y + 3 * r));
    const acc = dark ? darkAcc : lightAcc, k = dark ? .55 : .35;
    for (let yy = y1; yy <= y2; yy++) for (let xx = x1; xx <= x2; xx++) {
      const ddx = xx - x, ddy = (yy - y) * asp;
      acc[yy * W + xx] += s * k * Math.exp(-(ddx * ddx + ddy * ddy) / (2 * r * r));
    }
  }

  // compose
  for (let y = 0; y < H; y++) {
    const sy = clamp(y - dy, 0, H - 1);
    for (let x = 0; x < W; x++) {
      const sx = clamp(x - dx, 0, W - 1), j = sy * W + sx, i = y * W + x, i4 = i * 4, j4 = j * 4;
      const m = mask[j];
      if (m <= 0) { o[i4] = src[j4]; o[i4 + 1] = src[j4 + 1]; o[i4 + 2] = src[j4 + 2]; o[i4 + 3] = src[j4 + 3]; continue; }
      const g = gm[j], v = vig[i] * fl, L = lightAcc[i], D = 1 - Math.min(darkAcc[i], 1);
      const r = ((base[j * 3] + (nz[i4] - 128) / 32 * g) * v + L) * D;
      const gg = ((base[j * 3 + 1] + (nz[i4 + 1] - 128) / 32 * g) * v + L) * D;
      const b = ((base[j * 3 + 2] + (nz[i4 + 2] - 128) / 32 * g) * v + L) * D;
      o[i4] = src[j4] * (1 - m) + r * 255 * m;
      o[i4 + 1] = src[j4 + 1] * (1 - m) + gg * 255 * m;
      o[i4 + 2] = src[j4 + 2] * (1 - m) + b * 255 * m;
      o[i4 + 3] = src[j4 + 3];
    }
  }
  vctx.putImageData(outImg, 0, 0);
}

function updateCounter() {
  $("counter").innerHTML = "FR <b>" + String(frame + 1).padStart(2, "0") + "</b> / " + P.frames +
    " · " + (frame / P.fps).toFixed(2) + " s of " + (P.frames / P.fps).toFixed(2) + " s";
  const cells = $("timeline").children;
  for (let k = 0; k < cells.length; k++) cells[k].classList.toggle("now", k === frame);
}

/* ---------------- playback loop ---------------- */
let last = 0, acc = 0;
function tick(t) {
  if (!recording) {
    const dt = last ? t - last : 0; last = t;
    if (playing) {
      acc += dt;
      const step = 1000 / P.fps;
      if (acc >= step) { frame = (frame + Math.floor(acc / step)) % P.frames; acc %= step; dirty = true; }
    }
    if (dirty) { renderFrame(frame); updateCounter(); dirty = false; }
  }
  requestAnimationFrame(tick);
}

/* ---------------- controls UI ---------------- */
function buildControls() {
  const body = $("rackBody"); body.innerHTML = "";
  for (const grp of GROUPS) {
    const det = document.createElement("details"); det.className = "group"; det.open = grp.open;
    const sum = document.createElement("summary"); sum.textContent = grp.name; det.appendChild(sum);
    if (grp.note) { const n = document.createElement("p"); n.className = "group-note"; n.textContent = grp.note; det.appendChild(n); }
    for (const it of grp.items) det.appendChild(makeControl(it));
    body.appendChild(det);
  }
  // script export block
  const det = document.createElement("details"); det.className = "group";
  det.innerHTML = '<summary>Use in batch script</summary><div class="script-box"><p class="group-note">Paste this into the PRESETS dictionary in storm_film.py, then run the command underneath it to process a whole folder with these settings.</p><textarea id="scriptOut" readonly aria-label="Preset for storm_film.py"></textarea><button type="button" id="copyScript">Copy preset and command</button><span class="status" id="copyStatus"></span></div>';
  body.appendChild(det);
  $("copyScript").addEventListener("click", copyScript);
  updateScript();
}

function makeControl(it) {
  const row = document.createElement("div"); row.className = "ctrl";
  const id = "c_" + it.key;
  if (it.type === "check") {
    row.classList.add("check");
    row.innerHTML = '<input type="checkbox" id="' + id + '"><label for="' + id + '">' + it.label + '</label>';
    const inp = row.querySelector("input"); inp.checked = !!P[it.key];
    inp.addEventListener("change", () => setParam(it, inp.checked));
    return row;
  }
  const lab = document.createElement("label"); lab.htmlFor = id; lab.textContent = it.label; row.appendChild(lab);
  if (it.type === "select") {
    const sel = document.createElement("select"); sel.id = id;
    for (const [v, t] of it.options) { const op = document.createElement("option"); op.value = v; op.textContent = t; sel.appendChild(op); }
    sel.value = String(P[it.key]);
    sel.addEventListener("change", () => setParam(it, it.num ? +sel.value : sel.value));
    row.appendChild(sel);
  } else if (it.type === "seed") {
    const wrap = document.createElement("div"); wrap.className = "seed-row";
    const num = document.createElement("input"); num.type = "number"; num.id = id; num.min = 1; num.max = 99999; num.value = P.seed;
    const sh = document.createElement("button"); sh.type = "button"; sh.textContent = "Shuffle";
    num.addEventListener("change", () => setParam(it, Math.max(1, Math.floor(+num.value || 1))));
    sh.addEventListener("click", () => { const v = 1 + Math.floor(Math.random() * 9999); num.value = v; setParam(it, v); });
    wrap.append(num, sh); row.appendChild(wrap);
  } else {
    const out = document.createElement("output"); out.htmlFor = id; out.id = id + "_o"; out.textContent = it.fmt(P[it.key]);
    const inp = document.createElement("input"); inp.type = "range"; inp.id = id;
    inp.min = it.min; inp.max = it.max; inp.step = it.step; inp.value = P[it.key];
    inp.addEventListener("input", () => { const v = +inp.value; out.textContent = it.fmt(v); setParam(it, v); });
    row.append(out, inp);
  }
  if (it.hint) { const h = document.createElement("span"); h.className = "hint"; h.textContent = it.hint; row.appendChild(h); }
  return row;
}

function setParam(it, v) {
  P[it.key] = v;
  if (LOOK_KEYS.includes(it.key)) { presetId = "custom"; syncPresetSelect(); }
  if (it.kind === "prep") { prepare(); setStatus(maskNote); }
  else if (it.kind === "color") prepareColor();
  if (it.kind === "sched" || it.key === "frames") { if (frame >= P.frames) frame = 0; buildSchedule(); }
  dirty = true; persist(); updateScript();
}

function syncControls() {
  for (const grp of GROUPS) for (const it of grp.items) {
    const el = $("c_" + it.key); if (!el) continue;
    if (it.type === "check") el.checked = !!P[it.key];
    else if (it.type === "select" || it.type === "seed") el.value = String(P[it.key]);
    else { el.value = P[it.key]; const o = $("c_" + it.key + "_o"); if (o) o.textContent = it.fmt(P[it.key]); }
  }
}

function buildPresetSelect() {
  const sel = $("preset"); sel.innerHTML = "";
  for (const [id, p] of Object.entries(PRESETS)) { const o = document.createElement("option"); o.value = id; o.textContent = p.label; sel.appendChild(o); }
  const c = document.createElement("option"); c.value = "custom"; c.textContent = "Custom (your edits)"; sel.appendChild(c);
  syncPresetSelect();
  sel.addEventListener("change", () => { if (sel.value !== "custom") applyPreset(sel.value); });
  $("resetPreset").addEventListener("click", () => applyPreset(presetId === "custom" ? "bright" : presetId));
}
function syncPresetSelect() { $("preset").value = presetId; }
function applyPreset(id) {
  const p = PRESETS[id]; if (!p) return;
  for (const k of LOOK_KEYS) P[k] = p[k];
  presetId = id; syncPresetSelect(); syncControls();
  if (frame >= P.frames) frame = 0;
  prepareColor(); buildSchedule(); persist(); updateScript(); dirty = true;
}

/* ---------------- script preset ---------------- */
function scriptText() {
  const r = P.renderScale, f = n => (+n).toFixed(3).replace(/0+$/, "").replace(/\.$/, ".0");
  const gsize = r > 1 ? P.grainSize / 0.6 : P.grainSize;
  const soften = P.softness * 4 / r;
  return '    "legacy_custom": dict(sepia=' + f(P.sepia) + ', desat=' + f(P.desat) + ', fade=' + f(P.fade) +
    ', grain=' + f(P.grain) + ', gsize=' + f(gsize) + ', vignette=' + f(P.vignette) + ', blur=0.0,\n' +
    '                          scratches=' + P.lanes + ', dust=' + P.dust + ', flicker=' + f(P.flicker) + ', bright=' + f(P.bright) + ',\n' +
    '                          scratch_dark=' + f(P.darkShare) + ', scratch_hold=' + P.hold + ', scratch_strength=1.0, scratch_lanes=' + P.lanes +
    ', scratch_passes=' + P.passes + ',\n' +
    '                          dark_opacity=' + f(P.blackOpacity) + ', dark_soften=' + f(soften) +
    ', light_opacity=' + f(P.whiteOpacity) + ', light_soften=' + f(soften) + '),\n\n' +
    '# then:\n' +
    'python storm_film.py --batch boxes/ boxes_legacy/ --preset legacy_custom --frames ' + P.frames +
    ' --fps ' + P.fps + ' --weave ' + Math.round(P.wobble / r) + ' --render-scale ' + r + (P.maskMode === "auto" ? ' --mask auto' : '') +
    '\n# (batch writes GIFs; for MP4 run one file at a time with an .mp4 output name)';
}
function updateScript() { const t = $("scriptOut"); if (t) t.value = scriptText(); }
async function copyScript() {
  const t = $("scriptOut"), s = $("copyStatus");
  try { await navigator.clipboard.writeText(t.value); s.textContent = "Copied."; s.className = "status ok"; }
  catch (e) { t.focus(); t.select(); s.textContent = "Selected. Press Ctrl+C or ⌘C to copy."; s.className = "status"; }
}

/* ---------------- image input ---------------- */
function loadFromUrl(url, name) {
  const im = new Image();
  im.onload = () => {
    img = im; natW = im.naturalWidth; natH = im.naturalHeight; srcName = name;
    $("fileName").textContent = name === "box_art" ? "Sample: box art" : name;
    frame = 0; $("result").hidden = true;
    prepare();
    const capped = R < P.renderScale ? " Render size reduced to " + R + "× for a large image." : "";
    setStatus(natW + "×" + natH + " px, rendering at " + W + "×" + H + ". " + maskNote + capped);
  };
  im.onerror = () => setStatus("That file couldn't be opened as an image. Try a PNG or JPG.", "warn");
  im.src = url;
}
function loadFile(file) {
  if (!file || !file.type.startsWith("image/")) { setStatus("Pick an image file (PNG, JPG or WebP).", "warn"); return; }
  const name = file.name.replace(/\.[^.]+$/, "").replace(/[^\w\-]+/g, "_") || "image";
  const reader = new FileReader();
  reader.onload = () => loadFromUrl(reader.result, name);
  reader.readAsDataURL(file);
}
$("file").addEventListener("change", e => { loadFile(e.target.files[0]); e.target.value = ""; });
const gate = $("gate");
gate.addEventListener("dragover", e => { e.preventDefault(); gate.classList.add("drag"); });
gate.addEventListener("dragleave", () => gate.classList.remove("drag"));
gate.addEventListener("drop", e => { e.preventDefault(); gate.classList.remove("drag"); loadFile(e.dataTransfer.files[0]); });
window.addEventListener("paste", e => {
  const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith("image/"));
  if (f) loadFile(f);
});

/* ---------------- transport ---------------- */
function syncPlay() { const b = $("play"); b.textContent = playing ? "Pause" : "Play"; b.setAttribute("aria-label", playing ? "Pause" : "Play"); }
$("play").addEventListener("click", () => { playing = !playing; syncPlay(); });
$("prev").addEventListener("click", () => { playing = false; syncPlay(); frame = (frame - 1 + P.frames) % P.frames; dirty = true; });
$("next").addEventListener("click", () => { playing = false; syncPlay(); frame = (frame + 1) % P.frames; dirty = true; });
const cmp = $("compare");
const cmpOn = e => { e.preventDefault(); showOriginal = true; $("badge").hidden = false; dirty = true; };
const cmpOff = () => { if (!showOriginal) return; showOriginal = false; $("badge").hidden = true; dirty = true; };
cmp.addEventListener("pointerdown", cmpOn);
["pointerup", "pointerleave", "pointercancel", "blur"].forEach(ev => cmp.addEventListener(ev, cmpOff));
cmp.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") cmpOn(e); });
cmp.addEventListener("keyup", cmpOff);
$("zoom").addEventListener("change", e => {
  const z = e.target.value; gate.className = "gate zoom-" + z;
  view.style.width = z === "fit" ? "" : (W * +z) + "px";   // 100% = one screen pixel per rendered pixel
});

/* ---------------- export ---------------- */
let downloads = null;
(async () => {
  try { if (window.claude && typeof window.claude.use === "function") downloads = await window.claude.use("downloads"); } catch (e) { downloads = null; }
})();
async function offer(blob, filename) {
  if (!downloads) {
    if (!window.claude) {   // opened directly (GitHub Pages or a local file): a normal browser download
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      setStatus("Downloaded " + filename + ".", "ok"); return true;
    }
    setStatus("Saving files isn't available in this view.", "warn"); return false;
  }
  try { await downloads.save({ filename, data: blob }); setStatus("Saved " + filename + ".", "ok"); return true; }
  catch (e) {
